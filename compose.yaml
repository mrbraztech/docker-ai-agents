name: ai-agents

services:
  workspace:
    image: agents-base:latest
    build:
      context: .
      dockerfile: Dockerfile

    stdin_open: true
    tty: true
    init: true

    working_dir: /workspace

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - path: ${HOME}/.config/opencode/9router.env
        required: false
      - path: ${HOME}/.config/opencode/go.env
        required: false

    environment:
      HOME: /home/agent
      TERM: xterm-256color
      COLORTERM: truecolor

      XDG_CONFIG_HOME: /home/agent/.config
      XDG_DATA_HOME: /home/agent/.local/share
      XDG_STATE_HOME: /home/agent/.local/state
      XDG_CACHE_HOME: /home/agent/.cache

      DISPLAY: ${DISPLAY}

      SSH_AUTH_SOCK: /ssh-agent

      GIT_TERMINAL_PROMPT: "0"

      GH_TOKEN: ${GH_TOKEN}

      # Team mode model selection. Empty values keep the agent's own default.
      AGENTS_TEAM_PLANNER_MODEL: ${AGENTS_TEAM_PLANNER_MODEL:-}
      AGENTS_TEAM_IMPLEMENTER_MODEL: ${AGENTS_TEAM_IMPLEMENTER_MODEL:-}

    volumes:
      # Monorepo only (the whole repository is the workspace).
      - ${WORKSPACE_DIR:-.}:/workspace

      # OpenCode configuration.
      - ${HOME}/.config/opencode:/home/agent/.config/opencode

      # OpenCode credentials, sessions, and state.
      - ${HOME}/.local/share/opencode:/home/agent/.local/share/opencode
      - ${HOME}/.local/state/opencode:/home/agent/.local/state/opencode
      - ${HOME}/.cache/opencode:/home/agent/.cache/opencode

      # Codex configuration, credentials, history, and sessions.
      - ${HOME}/.codex:/home/agent/.codex

      # Pi configuration, credentials, and sessions.
      - ${HOME}/.pi:/home/agent/.pi

      # Herdr Core configuration and state.
      - herdr-config:/home/agent/.config/herdr-core
      - herdr-state:/home/agent/.local/state/herdr-core

      # Shared team session/delegation state for CLI and TUI backends.
      - agents-team-state:/home/agent/.local/state/agents-team

      # Herdr TUI configuration, layout, and state.
      - herdr-tui-config:/home/agent/.config/herdr
      - herdr-tui-state:/home/agent/.local/state/herdr

      # SSH agent only; private keys are not mounted.
      - ${SSH_AUTH_SOCK}:/ssh-agent

      # SSH aliases and known hosts.
      - ${HOME}/.ssh/config:/home/agent/.ssh/config:ro
      - ${HOME}/.ssh/known_hosts:/home/agent/.ssh/known_hosts:ro

      # X11 clipboard.
      - /tmp/.X11-unix:/tmp/.X11-unix:ro

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
      - /run:rw,nosuid,nodev,noexec,size=64m,mode=0755

    restart: "no"

volumes:
  herdr-config:
  herdr-state:
  herdr-tui-config:
  herdr-tui-state:
  agents-team-state:
